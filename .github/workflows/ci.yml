name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-test-build:
    name: Lint · Test · Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install shared handler-core dependencies
        run: npm ci
        working-directory: shared

      - name: Install root API dependencies
        run: npm ci
        working-directory: .

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    # A normal run takes seconds. The cap keeps a pathological file from holding a runner for the default 6 hours.
    timeout-minutes: 5

    permissions:
      contents: read

    steps:
      # Full history (not the default depth 1): the range scan below needs the base and head commits of the change and
      # everything between them. No credentials are kept in the checkout, since nothing here pushes.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Scans git-tracked files only. The report lists file, line and rule name, never the matched text.
      # The --history mode is deliberately not run here: the known leak in old commits would fail forever.
      - name: Scan tracked files for secrets
        run: node scripts/check-secrets.mjs

      # The tip scan cannot see a secret that was committed and then removed by a later commit of the same pull request or
      # push, and that value is still in the pushed history. This step scans the ADDED lines of every commit in the range:
      #   pull_request  base.sha..head.sha (commits reachable from the PR head and not from its base; a fork's head commit
      #                 arrives through the PR merge commit that checkout fetches, and is present with fetch-depth 0)
      #   push          before..sha (a new or recreated branch has an all-zero "before": the step scans the commits reachable
      #                 from sha and from no branch under refs/remotes/origin/ that does not contain sha, which the full fetch
      #                 provides; a branch at or past sha (origin/main itself, or one pushed with it) never hides it. With no
      #                 such branch it scans every commit reachable from sha. Either way more than 2,000 commits exits 2 rather
      #                 than passing on a partial walk)
      # A commit that is not in the clone (a force-push removed the old tip, a fetch was partial) or a shallow clone fails the
      # step with exit code 2 and a message. It never passes silently and never falls back to the full-history audit.
      # The one path this step does not read is the scanner's own test files (app/src/lib/__tests__/checkSecrets*.test.js, exact
      # paths): they hold secret-shaped fixtures by design, and a rule added later in a PR can match a fixture line an earlier commit
      # of the same PR added and then rewrote, which history cannot fix. Those versions are counted and named in a "note:" line and
      # the files are reviewed by hand, like the scanner and this workflow (SECURITY_NOTICE.md). The tip scan above still reads them.
      # Event values reach the script only through env vars, are checked to be plain commit ids, and are quoted.
      - name: Scan commits in this change for secrets
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              base="$PR_BASE_SHA"
              head="$PR_HEAD_SHA"
              ;;
            push)
              base="$PUSH_BEFORE_SHA"
              head="$PUSH_AFTER_SHA"
              ;;
            *)
              echo "No commit range for a '$EVENT_NAME' run: only the tracked-file scan above applies."
              exit 0
              ;;
          esac
          id_pattern='^([0-9a-f]{40}|[0-9a-f]{64})$'
          if ! [[ "$base" =~ $id_pattern && "$head" =~ $id_pattern ]]; then
            echo "::error::The event did not give plain base and head commit ids, so the commits in this change cannot be scanned."
            exit 2
          fi
          node scripts/check-secrets.mjs --range "$base..$head"
