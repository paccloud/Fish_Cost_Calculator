<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish Cost Calculator — Mock-up C, Clear Water</title>
<style>
  :root {
    color-scheme: light;
    --bg: #e6f2f5; --card: #ffffff; --ink: #113540; --ink2: #3f6270; --teal: #0a6577; --slot: #d4eaf0; --line: #547f8d; --answer: #08505f; --soft: #cfe5eb;
    --btn: #0a6577; --btn-ink: #ffffff; --focus: #0b5fd1; --tag: #ffe9a8; --tag-ink: #4a3600;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0a181e; --card: #10262e; --ink: #e8f2f5; --ink2: #a6c1ca; --teal: #86d6e8; --slot: #183640; --line: #6f9aa8; --answer: #9be0f0; --soft: #1b3a45;
      --btn: #86d6e8; --btn-ink: #06222a; --focus: #ffd66b; --tag: #3a3213; --tag-ink: #ffe9a8;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0a181e; --card: #10262e; --ink: #e8f2f5; --ink2: #a6c1ca; --teal: #86d6e8; --slot: #183640; --line: #6f9aa8; --answer: #9be0f0; --soft: #1b3a45;
    --btn: #86d6e8; --btn-ink: #06222a; --focus: #ffd66b; --tag: #3a3213; --tag-ink: #ffe9a8;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }

  .ribbon { background: var(--tag); color: var(--tag-ink); font-size: .8125rem; font-weight: 600; text-align: center; padding: 6px 12px; }
  .page { max-width: 820px; margin: 0 auto; padding: 0 20px 56px; }
  header.bar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; color: var(--teal); font-size: 1.0625rem; }
  .brand svg { width: 26px; height: 26px; fill: var(--teal); }
  .theme { min-width: 48px; min-height: 48px; border-radius: 50%; border: 2px solid var(--line); background: transparent; color: var(--ink); font: inherit; cursor: pointer; }

  .eyebrow { margin: 12px 0 0; color: var(--ink2); font-weight: 600; letter-spacing: .02em; }
  h1 { margin: 4px 0 18px; font-size: clamp(1.9rem, 6.4vw, 3rem); line-height: 1.12; font-weight: 700; letter-spacing: -.02em; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 22px; }
  .pills button { min-height: 48px; padding: 0 20px; border-radius: 999px; border: 2px solid var(--line); background: transparent; color: var(--ink); font: 600 1rem system-ui, sans-serif; cursor: pointer; }
  .pills button[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: var(--btn-ink); }

  .card { background: var(--card); border-radius: 28px; padding: clamp(20px, 5vw, 36px); box-shadow: 0 2px 0 rgba(10, 60, 75, .06), 0 18px 40px rgba(10, 60, 75, .08); }
  .mad { margin: 0; font-size: clamp(1.25rem, 4.4vw, 1.9rem); line-height: 2.35; font-weight: 500; }
  .slot { display: inline-block; max-width: 100%; min-height: 48px; margin: 0 2px; padding: 2px 34px 2px 12px; font: 700 inherit system-ui, sans-serif; font-size: inherit; color: var(--teal);
    border: 0; border-bottom: 3px solid var(--teal); border-radius: 12px 12px 4px 4px; vertical-align: middle; line-height: 1.3; cursor: pointer;
    appearance: none; -webkit-appearance: none;
    background: linear-gradient(45deg, transparent 50%, currentColor 50%) calc(100% - 19px) 55% / 7px 7px no-repeat, linear-gradient(135deg, currentColor 50%, transparent 50%) calc(100% - 13px) 55% / 7px 7px no-repeat, var(--slot); }
  .nw { white-space: nowrap; }
  .slot:disabled { opacity: .55; cursor: not-allowed; }
  input.slot { padding-right: 12px; width: 6.4ch; text-align: center; background: var(--slot); font-variant-numeric: tabular-nums; cursor: text; }
  input.slot.wide { width: 7.6ch; }
  .slot option { font-size: 1rem; color: #000; background: #fff; }

  .answer { margin-top: 26px; padding-top: 24px; border-top: 2px dashed var(--soft); min-height: 12rem; }
  .answer .pre { margin: 0; color: var(--ink2); font-size: 1.125rem; font-weight: 600; }
  .answer .big { margin: 0; font-size: clamp(3.4rem, 15vw, 6rem); line-height: 1.02; font-weight: 800; color: var(--answer); letter-spacing: -.03em; font-variant-numeric: tabular-nums; animation: rise .35s ease-out; }
  .answer .big small { font-size: .3em; font-weight: 600; letter-spacing: 0; color: var(--ink2); }
  .answer .because { margin: 10px 0 0; font-size: 1.125rem; max-width: 34em; }
  .answer .because b { font-weight: 800; }
  .answer .waiting { margin: 0; color: var(--ink2); font-size: 1.25rem; padding-top: 12px; }
  @keyframes rise { from { opacity: .3; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  details.more { margin-top: 22px; border-top: 2px dashed var(--soft); padding-top: 8px; }
  details.more summary { min-height: 52px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: var(--teal); cursor: pointer; }
  .more .grid { display: grid; gap: 18px; padding: 8px 0 6px; }
  @media (min-width: 640px) { .more .grid { grid-template-columns: 1fr 1fr; } }
  .more label, .more .lab { display: block; font-weight: 700; margin-bottom: 6px; }
  .more .hint { font-weight: 400; color: var(--ink2); }
  .presets { display: flex; gap: 8px; flex-wrap: wrap; }
  .presets button { min-height: 48px; padding: 0 16px; border-radius: 12px; border: 2px solid var(--line); background: transparent; color: var(--ink); font: 700 .95rem system-ui, sans-serif; cursor: pointer; }
  .presets button[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); }
  .more input, .more select { width: 100%; min-height: 50px; padding: 8px 12px; border: 2px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font: 500 1.0625rem system-ui, sans-serif; font-variant-numeric: tabular-nums; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .answer .big { animation: none; } * { transition: none !important; } }
</style>
</head>
<body>
<div class="ribbon">Mock-up C · Clear Water — live sample with 5 species from the real yield data</div>
<div class="page">
  <header class="bar">
    <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c3-5 8-7 13-5l5-3v4l2 4-2 4v4l-5-3c-5 2-10 0-13-5z"/><circle cx="16" cy="10" r="1.2" fill="#fff"/></svg>Local Catch</div>
    <button class="theme" id="theme" type="button" aria-label="Switch color theme">◐</button>
  </header>

  <main>
    <p class="eyebrow">Fish Cost Calculator</p>
    <h1 id="headline">What does your fish really cost?</h1>
    <div class="pills" role="group" aria-label="What do you want to know?">
      <button type="button" id="m-cost" aria-pressed="true">What it costs me</button>
      <button type="button" id="m-weight" aria-pressed="false">How much to buy</button>
    </div>

    <div class="card">
      <p class="mad" id="sentence"></p>

      <div class="answer" id="answer" aria-live="polite"></div>

      <details class="more">
        <summary>Change the details</summary>
        <div class="grid">
          <div><span class="lab">Yield <span class="hint">how much is left after cutting</span></span>
            <div class="presets" id="presets" role="group" aria-label="Yield presets"></div>
            <label for="yield" class="sr">Yield percent</label>
            <div style="margin-top:8px"><input id="yield" type="number" min="1" max="100" step="any" inputmode="decimal" aria-label="Yield percent"></div></div>
          <div id="proc-wrap"><label for="proc">Processing cost per lb <span class="hint">(optional)</span></label>
            <input id="proc" type="number" min="0" step="any" inputmode="decimal" placeholder="$0.00">
            <label for="basis" style="margin-top:12px">Charged per lb of</label>
            <select id="basis"></select></div>
        </div>
      </details>
    </div>
  </main>
</div>

  const t = e.target;
  if (t.id === 'species') { S.species = t.value; S.from = fromList().includes('Round') ? 'Round' : ''; S.to = ''; S.yield = ''; fillAll(); }
  else if (t.id === 'from') { S.from = t.value; S.to = ''; S.yield = ''; fillAll(); }
  else if (t.id === 'to') { S.to = t.value; const c = conv(); S.yield = c ? String(c.yield) : ''; fillAll(); }
  else if (t.id === 'basis') { S.basis = t.value; renderAnswer(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (['cost', 'target', 'proc', 'yield'].includes(t.id)) { S[t.id] = t.value; if (t.id === 'yield') document.querySelectorAll('#presets button').forEach(b => b.setAttribute('aria-pressed', b.dataset.y === t.value)); renderAnswer(); }
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'm-cost' || b.id === 'm-weight') { S.mode = b.id === 'm-cost' ? 'cost' : 'weight'; buildSentence(); }
  else if (b.dataset.y) { S.yield = b.dataset.y; $('yield').value = S.yield; document.querySelectorAll('#presets button').forEach(x => x.setAttribute('aria-pressed', x.dataset.y === S.yield)); renderAnswer(); }
  else if (b.id === 'theme') { const d = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; document.documentElement.dataset.theme = d ? 'light' : 'dark'; }
});
buildSentence();
</script>
