# Firebase Auth identity-mapping operations for the issue #66 proof sandbox.
# These operations intentionally derive ownership from auth.uid rather than
# accepting a caller-supplied Firebase UID.

query ResolveCurrentCanonicalUser @auth(level: USER) {
  firebaseAuthIdentities(
    where: { firebaseUid: { eq_expr: "auth.uid" } }
    limit: 1
  ) {
    firebaseUid
    providerId
    providerSubject
    emailAtLink
    isPrimary
    appUser {
      id
      legacyUserId
      primaryEmail
      displayName
      createdAt
      updatedAt
    }
  }
}

query AssertCanonicalUserOwnership($appUserId: UUID!) @auth(level: USER) {
  firebaseAuthIdentities(
    where: {
      firebaseUid: { eq_expr: "auth.uid" }
      appUserId: { eq: $appUserId }
    }
    limit: 1
  ) {
    appUser {
      id
      legacyUserId
      primaryEmail
    }
  }
}

query ListMyIdentityProofSavedCalculations @auth(level: USER) {
  identityProofSavedCalculations(
    where: { ownerFirebaseUid: { eq_expr: "auth.uid" } }
    orderBy: [{ createdAt: DESC }]
    limit: 50
  ) {
    id
    label
    speciesSlug
    createdAt
    appUser {
      id
      legacyUserId
    }
  }
}

query GetMyIdentityProofSavedCalculation($calculationId: UUID!)
  @auth(level: USER) {
  identityProofSavedCalculations(
    where: {
      id: { eq: $calculationId }
      ownerFirebaseUid: { eq_expr: "auth.uid" }
    }
    limit: 1
  ) {
    id
    label
    speciesSlug
    createdAt
    appUser {
      id
      legacyUserId
    }
  }
}

mutation CreateMyIdentityProofSavedCalculation(
  $label: String!
  $speciesSlug: String
) @auth(level: USER) @transaction {
  query
    @redact
    @check(
      expr: "response.query.firebaseAuthIdentities.size() == 1",
      message: "Authenticated Firebase user is not linked to one canonical app user."
    ) {
    firebaseAuthIdentities(
      where: { firebaseUid: { eq_expr: "auth.uid" } }
      limit: 2
    ) {
      appUser {
        id
      }
    }
  }
  identityProofSavedCalculation_insert(data: {
    appUserId_expr: "response.query.firebaseAuthIdentities[0].appUser.id"
    ownerFirebaseUid_expr: "auth.uid"
    label: $label
    speciesSlug: $speciesSlug
  })
}
